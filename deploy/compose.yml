# O produto no ar, numa máquina só.
#
#   cd /opt/barbearia && docker compose -f deploy/compose.yml up -d
#
# ## O que este arquivo tem que o `docker-compose.yml` da raiz não tem
#
# Aquele é para **olhar o produto**: sobe tudo, semeia uma barbearia de mentira
# e publica nas portas do laço. Este é para **operar**: volume que sobrevive ao
# `down`, reinício automático, TLS, backup, e nenhuma porta na internet além das
# 80 e 443 do porteiro.
#
# As diferenças que mais importam, e o motivo de cada uma:
#
# | Aqui | Lá | Por quê |
# |---|---|---|
# | volume nomeado no banco | efêmero | `docker compose down` não pode levar a base de clientes junto |
# | `restart: unless-stopped` | nenhum | o VPS reinicia sozinho depois de uma atualização de kernel |
# | sem `ports` na API e no web | `127.0.0.1:3000` | quem fala com a internet é o Caddy, e só ele |
# | sem o perfil `demo` | tem | a semente cria uma conta de dono com senha publicada no repositório |
# | `NODE_ENV=production` | não | é o que liga `secure` no cookie de sessão |
#
# ## Uma máquina, e isso é decisão
#
# Banco e aplicação no mesmo host é o que dá para operar com uma pessoa. O custo
# está escrito: o backup é a única cópia dos dados, e por isso ele sai da máquina
# (`deploy/backup.sh`). Quando a barbearia número trinta chegar, o banco vira
# serviço gerenciado — e a única linha que muda é `DATABASE_URL`.

name: barbearia

x-imagem: &imagem
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped

x-ambiente: &ambiente
  NODE_ENV: production
  # Sem nenhum `:-` de reserva: todas falham alto quando ausentes, e é assim
  # que o produto foi escrito. Um padrão fraco aqui deixaria segredo em repouso
  # cifrado com chave conhecida, e ninguém descobriria.
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?rode deploy/instalar.sh para gerar o .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta no .env}
  STAFF_EMAIL_PEPPER: ${STAFF_EMAIL_PEPPER:?falta no .env}
  OTP_PEPPER: ${OTP_PEPPER:?falta no .env}
  MFA_SECRET_KEY: ${MFA_SECRET_KEY:?falta no .env}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?falta no .env}
  WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?falta no .env}
  WHATSAPP_TOKEN_KEY: ${WHATSAPP_TOKEN_KEY:?falta no .env}
  KYC_INTENT_HMAC_SECRET: ${KYC_INTENT_HMAC_SECRET:?falta no .env}
  MARKETPLACE_ORIGIN_SECRET: ${MARKETPLACE_ORIGIN_SECRET:?falta no .env}
  # Backup cifrado: chave própria, porque restaurar não pode depender de a
  # chave do segundo fator continuar a mesma.
  BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?falta no .env}
  # OTP e credencial de primeiro acesso por WhatsApp. `console` é o padrão e
  # não exige nada; `meta` exige os quatro abaixo.
  IDENTITY_MESSAGING_MODO: ${IDENTITY_MESSAGING_MODO:-console}
  IDENTITY_WHATSAPP_PHONE_NUMBER_ID: ${IDENTITY_WHATSAPP_PHONE_NUMBER_ID:-}
  IDENTITY_WHATSAPP_ACCESS_TOKEN: ${IDENTITY_WHATSAPP_ACCESS_TOKEN:-}
  IDENTITY_WHATSAPP_OTP_TEMPLATE: ${IDENTITY_WHATSAPP_OTP_TEMPLATE:-}
  IDENTITY_WHATSAPP_STAFF_TEMPLATE: ${IDENTITY_WHATSAPP_STAFF_TEMPLATE:-}
  IDENTITY_WHATSAPP_LANGUAGE: ${IDENTITY_WHATSAPP_LANGUAGE:-pt_BR}
  DATABASE_URL: postgres://barbearia_app:${APP_DB_PASSWORD}@db:5432/barbearia
  ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
  # De servidor para servidor, dentro da rede do compose.
  API_URL: http://api:3000
  # Mídia: local serve desenvolvimento/instalação simples; `s3` usa um
  # bucket privado S3/R2/MinIO, mantendo a URL pública em /media/... .
  MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
  MEDIA_ROOT: /data/media
  MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
  MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
  MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
  MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
  MEDIA_S3_ALLOW_HTTP: ${MEDIA_S3_ALLOW_HTTP:-0}
  # O endereço público, e ele **sai em mensagem**: convite de vaga, pedido de
  # avaliação, link da nota e o retorno do checkout da Stripe. Errado aqui, o
  # cliente recebe um endereço que não abre.
  WEB_URL: https://${DOMINIO:?falta no .env}
  # Os interruptores das integrações. `nenhum` é o padrão de fábrica e é
  # operação legítima: a plataforma fatura pelo extrato e a nota não é
  # oferecida. Trocar aqui é o que liga cada uma.
  PSP_MODO: ${PSP_MODO:-nenhum}
  FISCAL_MODO: ${FISCAL_MODO:-nenhum}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  # O canal de mensagem deste processo (bloco 82). `nenhum` é o padrão de
  # fábrica: tudo continua saindo pelo canal de reserva, e nada vai para a
  # internet sem alguém ter decidido.
  WHATSAPP_MODO: ${WHATSAPP_MODO:-nenhum}
  # O app da plataforma na Meta, para o Embedded Signup (bloco 83). Vazios, a
  # tela não desenha o botão e o cadastro à mão continua sendo o caminho.
  #
  # **Sem estas quatro linhas, pôr as variáveis no `.env` não faz nada**: o
  # compose só entrega ao contêiner o que ele repassa aqui, e o processo leria
  # `undefined` com o `.env` preenchido — o defeito do campo que o motor aceita
  # e ninguém preenche, na sua forma mais silenciosa.
  META_APP_ID: ${META_APP_ID:-}
  META_CONFIG_ID: ${META_CONFIG_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  WHATSAPP_ONBOARDING: ${WHATSAPP_ONBOARDING:-padrao}
  # Proteção anti-bot da criação de conta. A site key é pública; a secret key
  # nunca sai do servidor/API. O preflight recusa produção sem as três.
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta no .env}
      POSTGRES_DB: postgres
      # Fuso do processo em UTC, como todo `timestamptz` do schema. O fuso que
      # decide grade e dia da venda vem da **unidade**, nunca do servidor.
      TZ: UTC
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 30
    # Sem `ports`: o banco não tem endereço na internet. Quem precisa dele
    # entra na máquina e usa `docker compose exec`.

  preparar:
    <<: *imagem
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment: *ambiente
    # Cria o banco, o role sem BYPASSRLS e aplica as migrações que faltam.
    # Serviço próprio e não um passo dentro da API: migração que roda junto com
    # a aplicação roda uma vez por réplica.
    #
    # Quem decide o que falta é `packages/db/scripts/migrate.sh`, e o laço que
    # existia aqui virou uma chamada a ele de propósito: eram duas cópias da
    # mesma ideia, e a daqui aplicava **todas** as migrações a cada subida. Na
    # segunda, o `0001` reencontrava o próprio tipo e saía com 3 — e como `api`,
    # `worker` e `web` esperam este serviço com `service_completed_successfully`,
    # o compose abortava a subida e o Caddy não subia. Atualizar derrubava o site.
    command: >
      bash -c '
        set -e
        node scripts/verificar-configuracao-producao.mjs
        psql "$$ADMIN_DATABASE_URL" -q -tAc "SELECT 1 FROM pg_database WHERE datname = '"'"'barbearia'"'"'" | grep -q 1 \
          || psql "$$ADMIN_DATABASE_URL" -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE barbearia"
        scripts/bootstrap-role.sh > /dev/null
        DATABASE_URL="postgres://postgres:$$POSTGRES_PASSWORD@db:5432/barbearia" packages/db/scripts/migrate.sh
      '

  api:
    <<: *imagem
    depends_on:
      preparar:
        condition: service_completed_successfully
    environment: *ambiente
    volumes:
      - media:/data/media
    command: node apps/api/dist/main.js
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/health/pronto | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *imagem
    depends_on:
      preparar:
        condition: service_completed_successfully
    environment: *ambiente
    command: node apps/worker/dist/main.js

  web:
    <<: *imagem
    depends_on:
      api:
        condition: service_healthy
    environment: *ambiente
    command: pnpm --filter @barbearia/web exec next start -p 3001 -H 0.0.0.0

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      DOMINIO: ${DOMINIO:?falta no .env}
      ACME_EMAIL: ${ACME_EMAIL:?falta no .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # O certificado emitido mora aqui. Sem volume, cada `up` pediria um novo
      # ao Let's Encrypt — que tem limite semanal por domínio, e estourá-lo
      # deixa o site sem TLS por dias.
      - caddy-dados:/data
      - caddy-config:/config
      - caddy-log:/var/log/caddy

volumes:
  dados:
  media:
  caddy-dados:
  caddy-config:
  caddy-log:
