# O Definition of Done, fora da máquina de quem escreveu o código.
#
# `pnpm verify` já era o portão; até aqui ele só rodava onde o autor mandasse.
# "Passa na minha máquina" é a categoria inteira de defeito que esta esteira
# fecha — e ela achou o primeiro antes de existir: o script de medição pedia o
# Playwright por um caminho absoluto de instalação global, e funcionava só neste
# container.
#
# ## Por que dois jobs, e não um
#
# O `portao` é o que decide se o commit presta: typecheck, testes contra
# Postgres de verdade e build. Ele precisa ser verde sempre.
#
# A `medicao` sobe API, Web e Worker e mede navegador, carga de leitura e a
# disputa destrutiva de reserva. É legítimo ela
# ser mais lenta e mais barulhenta — o que ela não pode é atrasar o retorno do
# portão. Separada, o autor sabe em ~3 minutos se quebrou alguma regra, e a
# medição chega quando chegar.

name: portão

on:
  push:
    branches: ['**']
  pull_request:

# Push seguido cancela a execução anterior do mesmo ramo: ninguém lê o
# resultado de um commit que já foi substituído, e a fila é compartilhada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A senha do role da aplicação é sorteada por execução. Sem default: senha
  # previsível é senha vazada (CLAUDE.md §2), e o `bootstrap-role.sh` recusa
  # rodar sem ela.
  ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

jobs:
  portao:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # A imagem oficial já traz pgcrypto, citext, btree_gist, pg_trgm e
        # unaccent no contrib; as migrações as criam sozinhas.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # O secret scan precisa enxergar commits antigos, não só o snapshot.
          fetch-depth: 0

      - name: varredura de segredos
        run: node scripts/verificar-segredos.mjs --history

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: instalar dependências
        # O navegador é da medição, não do portão. Baixá-lo aqui seria ~150 MB
        # por execução para nada.
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: cliente do prisma
        # O `pnpm install --ignore-scripts` da esteira não roda o postinstall
        # do Prisma, e sem o cliente gerado o typecheck reprova sobre um tipo
        # que existe.
        run: pnpm --filter @barbearia/db db:generate

      - name: verify
        run: pnpm verify
        env:
          APP_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-portao

      - name: varredura de dependências
        # Vulnerabilidade high/critical conhecida não pode atravessar o mesmo
        # portão que chama o commit de pronto. Se um advisory novo surgir, o
        # bloqueio é intencional: atualizar/mitigar e só então publicar.
        run: pnpm audit --audit-level high

  medicao:
    name: pilha, navegador e cargas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Só depois do portão: medir o layout de um commit que não compila é gastar
    # três minutos para descobrir o que o portão já disse em um.
    needs: portao

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-medicao
      DEMO_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/demo
      API_URL: http://127.0.0.1:3000
      WEB_URL: http://127.0.0.1:3001
      STAFF_EMAIL_PEPPER: pepper-da-esteira
      # A carga dispara milhares de requisições do mesmo IP, e o limite padrão é
      # de 120 por minuto. Com ele ligado, a medição mede o rate limit — foi o
      # que aconteceu: 19 horários vendidos e **nenhuma recusa**, porque o 429
      # caía na leitura da grade e o laço parava antes de tentar marcar.
      # O limite tem suíte própria (`rate-limit.e2e.test.ts`); aqui ele é ruído.
      RATE_LIMIT_SHORT: '1000000'
      RATE_LIMIT_LONG: '1000000'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: instalar dependências
        run: pnpm install --frozen-lockfile

      - name: cliente do prisma
        run: pnpm --filter @barbearia/db db:generate

      - name: instalar o navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: medição
        # Um passo só, chamando o mesmo script que roda na máquina de quem
        # escreve. O job era uma sequência de comandos soltos dentro deste
        # YAML — criar banco, migrar, construir, subir, esperar, medir — e nada
        # daquilo rodava localmente. O resultado foi depurar por tentativa
        # contra um laço de oito minutos por volta, aprendendo um fato por
        # execução. Quatro voltas, quatro causas, todas reproduzíveis aqui.
        #
        # A regra que fica: a esteira não contém lógica que não roda fora dela.
        run: scripts/medicao.sh
